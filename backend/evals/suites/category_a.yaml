# Category A — must answer confidently with a correct clause citation.
# From Dave's baseline plan.
#
# NOTE ON SCORING: accepted_citations is EMPTY on every case below. Until a
# domain reviewer fills them in, the runner can only check that a confident,
# cited answer came back — it cannot check the clause is the RIGHT one, and it
# marks every such case NEEDS REVIEWER in the report.
#
# Section G of the baseline plan flags exactly this: if Dave cannot verify these
# himself, a paid maritime reviewer is needed, and that cost lands now rather
# than at Seed. Do not report a Category A pass rate externally until these are
# filled in — a pass here currently means "answered", not "answered correctly".
category: A

_default_vessel: &default_vessel
  vessel_type: workboat
  length_overall: 11.0
  area_category: 2
  hull_material: GRP
  passenger_count: 8

